
name: Monitor Rádio Graciosa

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:

      - name: Verificar stream da Rádio Graciosa
        shell: bash
        run: |

          STREAM="https://servidor33-2.brlogic.com:7200/live?source=7074"

          echo "======================================"
          echo "MONITORAMENTO DA RÁDIO"
          echo "Posto: Posto Graciosa"
          echo "Data: $(date '+%d/%m/%Y')"
          echo "Horário: $(date '+%H:%M:%S')"
          echo "======================================"

          echo ""
          echo "Conectando ao stream..."

          TEMP_FILE=$(mktemp)

          HTTP_CODE=$(curl \
            -L \
            -sS \
            --connect-timeout 10 \
            --max-time 15 \
            -r 0-65535 \
            -o "$TEMP_FILE" \
            -w "%{http_code}" \
            "$STREAM" || true)


          BYTES=$(wc -c < "$TEMP_FILE")

          echo ""
          echo "HTTP: $HTTP_CODE"
          echo "Bytes recebidos: $BYTES"


          echo ""
          echo "Analisando resultado..."


          if [ "$HTTP_CODE" = "200" ] && [ "$BYTES" -gt 1024 ]; then

              echo ""
              echo "🟢 STATUS: ONLINE"
              echo "Stream respondeu e entregou dados."
              echo "Dados recebidos: $BYTES bytes"

              rm -f "$TEMP_FILE"

              exit 0

          fi


          echo ""
          echo "🔴 STATUS: OFFLINE"
          echo "Não foi possível confirmar a entrega do stream."


          rm -f "$TEMP_FILE"

          exit 1
