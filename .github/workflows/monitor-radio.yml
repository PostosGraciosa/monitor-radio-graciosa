name: Monitor Rádio Graciosa

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar stream da Rádio Graciosa
        shell: bash
        run: |

          STREAM="https://servidor33-2.brlogic.com:7200/live?source=7074"

          APPS_SCRIPT="https://script.google.com/macros/s/AKfycbyTJwiUpNO1a3-u5IGYL6V-sMPZweH4Ph-xT2KS8q9xt0nE0sCG4nnyH4ZrcdP9ZZK/exec"

          POSTO="POSTO GRACIOSA"

          DATA=$(date '+%d/%m/%Y')
          HORA=$(date '+%H:%M:%S')

          echo "======================================"
          echo "MONITORAMENTO DA RÁDIO"
          echo "Posto: $POSTO"
          echo "Data: $DATA"
          echo "Horário: $HORA"
          echo "======================================"

          TEMP_FILE=$(mktemp)
          ERROR_FILE=$(mktemp)
          HTTP_FILE=$(mktemp)

          echo ""
          echo "Conectando ao stream..."

          #
          # IMPORTANTE:
          #
          # O stream é contínuo.
          # Por isso o CURL pode terminar com código 28
          # (timeout) mesmo tendo recebido dados corretamente.
          #
          # O "|| true" impede que o GitHub Actions
          # encerre o workflow nesse momento.
          #

          set +e

          curl \
            -L \
            -sS \
            --connect-timeout 10 \
            --max-time 15 \
            -r 0-65535 \
            -o "$TEMP_FILE" \
            -w "%{http_code}" \
            "$STREAM" \
            > "$HTTP_FILE" \
            2> "$ERROR_FILE"

          CURL_EXIT=$?

          set -e

          #
          # Ler informações retornadas pelo CURL
          #

          HTTP_CODE=$(cat "$HTTP_FILE" 2>/dev/null || echo "000")

          BYTES=$(wc -c < "$TEMP_FILE" 2>/dev/null || echo "0")

          CURL_ERROR=$(cat "$ERROR_FILE" 2>/dev/null || true)

          #
          # Garantir valores válidos
          #

          if [ -z "$HTTP_CODE" ]; then
            HTTP_CODE="000"
          fi

          if ! [[ "$BYTES" =~ ^[0-9]+$ ]]; then
            BYTES="0"
          fi

          echo ""
          echo "Código CURL: $CURL_EXIT"
          echo "HTTP: $HTTP_CODE"
          echo "Bytes recebidos: $BYTES"

          if [ -n "$CURL_ERROR" ]; then

            echo ""
            echo "Mensagem CURL:"
            echo "$CURL_ERROR"

          fi

          echo ""
          echo "Analisando resultado..."

          STATUS="offline"

          #
          # =====================================================
          # DEFINIÇÃO DO STATUS
          # =====================================================
          #
          # ONLINE:
          #
          # HTTP 200
          # E
          # pelo menos 1 KB recebido
          #
          # O código CURL 28 NÃO será considerado offline
          # se o servidor respondeu e entregou dados.
          #
          # Isso é importante porque o stream nunca termina
          # naturalmente.
          #

          if [ "$HTTP_CODE" = "200" ] && [ "$BYTES" -gt 1024 ]; then

            STATUS="online"

            echo ""
            echo "🟢 STATUS: ONLINE"
            echo "Stream respondeu e entregou dados."
            echo "Dados recebidos: $BYTES bytes"

            if [ "$CURL_EXIT" = "28" ]; then

              echo ""
              echo "ℹ️ CURL encerrou por timeout."
              echo "Isso é esperado em um stream contínuo."

            fi

          else

            STATUS="offline"

            echo ""
            echo "🔴 STATUS: OFFLINE"
            echo "Não foi possível confirmar a entrega do stream."

          fi

          #
          # =====================================================
          # RESULTADO
          # =====================================================

          echo ""
          echo "======================================"
          echo "RESULTADO"
          echo "Posto: $POSTO"
          echo "Status: $STATUS"
          echo "Data: $DATA"
          echo "Horário: $HORA"
          echo "HTTP: $HTTP_CODE"
          echo "Bytes: $BYTES"
          echo "CURL: $CURL_EXIT"
          echo "======================================"

          #
          # =====================================================
          # ENVIAR RESULTADO PARA O GOOGLE APPS SCRIPT
          # =====================================================

          echo ""
          echo "Enviando resultado para o Google Apps Script..."

          set +e

          RESPONSE=$(curl \
            -L \
            -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -G \
            --data-urlencode "posto=$POSTO" \
            --data-urlencode "status=$STATUS" \
            --data-urlencode "data=$DATA" \
            --data-urlencode "hora=$HORA" \
            --data-urlencode "bytes=$BYTES" \
            --data-urlencode "http=$HTTP_CODE" \
            --data-urlencode "curl=$CURL_EXIT" \
            "$APPS_SCRIPT" \
            2>&1)

          APPS_EXIT=$?

          set -e

          echo ""
          echo "Código do Apps Script: $APPS_EXIT"

          echo ""
          echo "Resposta do Apps Script:"
          echo "$RESPONSE"

          #
          # =====================================================
          # LIMPEZA
          # =====================================================

          rm -f "$TEMP_FILE"
          rm -f "$ERROR_FILE"
          rm -f "$HTTP_FILE"

          echo ""
          echo "======================================"
          echo "MONITORAMENTO CONCLUÍDO"
          echo "Posto: $POSTO"
          echo "Status: $STATUS"
          echo "Data: $DATA"
          echo "Horário: $HORA"
          echo "======================================"

          #
          # OFFLINE é resultado do monitoramento,
          # não uma falha do GitHub Actions.
          #

          exit 0
