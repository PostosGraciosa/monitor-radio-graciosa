
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Monitoramento da Rádio - Posto Graciosa"
    >

    <meta
        name="theme-color"
        content="#0e6835"
    >

    <title>
        Rádio | Posto Graciosa
    </title>


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e6835'/%3E%3Ccircle cx='50' cy='50' r='27' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='8' fill='white'/%3E%3Cpath d='M25 25c-7 7-11 16-11 25s4 18 11 25M75 25c7 7 11 16 11 25s-4 18-11 25' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    >


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4f0 0%,
                    #f7f9f8 50%,
                    #e9f1ec 100%
                );

            color: #1f2937;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

        }


        /* =========================================
           PÁGINA
        ========================================= */

        .pagina {

            width: 100%;

            max-width: 960px;

            background: #ffffff;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 18px 55px
                rgba(14, 104, 53, 0.14);

        }


        /* =========================================
           CABEÇALHO
        ========================================= */

        .cabecalho {

            background:
                linear-gradient(
                    135deg,
                    #0e6835,
                    #095429
                );

            color: #ffffff;

            padding: 28px 32px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

        }


        .marca {

            display: flex;

            align-items: center;

            gap: 16px;

        }


        .icone-radio {

            width: 56px;

            height: 56px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.14);

            border:
                1px solid
                rgba(255,255,255,0.20);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

        }


        .empresa {

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            opacity: 0.82;

            margin-bottom: 5px;

        }


        .titulo {

            font-size: 28px;

            font-weight: 800;

            line-height: 1.1;

        }


        .subtitulo {

            font-size: 13px;

            opacity: 0.82;

            margin-top: 7px;

        }


        /* =========================================
           STATUS
        ========================================== */

        .status {

            min-width: 155px;

            padding: 12px 17px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.16);

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .status-ponto {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #31dc86;

            box-shadow:
                0 0 0 5px
                rgba(49,220,134,0.15);

            flex-shrink: 0;

        }


        .status-info {

            display: flex;

            flex-direction: column;

            gap: 2px;

        }


        .status-label {

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            opacity: 0.72;

        }


        .status-texto {

            font-size: 13px;

            font-weight: 800;

        }


        .status.atencao .status-ponto {

            background: #e7b91d;

            box-shadow:
                0 0 0 5px
                rgba(231,185,29,0.15);

        }


        .status.offline .status-ponto {

            background: #e53935;

            box-shadow:
                0 0 0 5px
                rgba(229,57,53,0.15);

        }


        /* =========================================
           CONTEÚDO
        ========================================== */

        .conteudo {

            padding: 32px;

        }


        /* =========================================
           CARDS DE INFORMAÇÃO
        ========================================== */

        .informacoes {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .info-card {

            border:
                1px solid #e6ebe8;

            background: #f8faf9;

            border-radius: 15px;

            padding: 18px 20px;

        }


        .info-label {

            display: block;

            color: #7a827d;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }


        .info-valor {

            color: #0e6835;

            font-size: 20px;

            font-weight: 800;

        }


        /* =========================================
           PLAYER
        ========================================== */

        .player-area {

            border:
                1px solid #e3e8e5;

            border-radius: 17px;

            overflow: hidden;

            background: #ffffff;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.04);

        }


        .player-cabecalho {

            padding: 16px 20px;

            border-bottom:
                1px solid #e9edeb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .player-nome {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 14px;

            font-weight: 800;

        }


        .ao-vivo {

            font-size: 10px;

            font-weight: 800;

            color: #0e6835;

            background: #e9f6ee;

            padding: 6px 10px;

            border-radius: 20px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

        }


        .player {

            display: block;

            width: 100%;

            height: 165px;

            border: 0;

            background: #ffffff;

        }


        /* =========================================
           MONITORAMENTO
        ========================================== */

        .monitoramento {

            margin-top: 24px;

            display: grid;

            grid-template-columns:
                auto 1fr;

            gap: 15px;

            align-items: center;

            padding: 18px 20px;

            border-radius: 15px;

            background: #f8faf9;

            border:
                1px solid #e5ebe7;

        }


        .monitor-icone {

            width: 40px;

            height: 40px;

            border-radius: 12px;

            background: #e9f6ee;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

        }


        .monitor-titulo {

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 4px;

        }


        .monitor-texto {

            font-size: 12px;

            color: #707873;

            line-height: 1.5;

        }


        /* =========================================
           RODAPÉ
        ========================================== */

        .rodape {

            padding: 17px 32px;

            border-top:
                1px solid #e9edeb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            color: #7b827e;

            font-size: 11px;

        }


        .rodape strong {

            color: #0e6835;

        }


        /* =========================================
           RESPONSIVO
        ========================================== */

        @media (max-width: 700px) {

            body {

                padding: 10px;

            }


            .cabecalho {

                flex-direction: column;

                align-items: flex-start;

                padding: 23px;

            }


            .status {

                width: 100%;

            }


            .conteudo {

                padding: 20px;

            }


            .informacoes {

                grid-template-columns: 1fr;

            }


            .player-cabecalho {

                align-items: flex-start;

                flex-direction: column;

            }


            .rodape {

                padding:
                    16px 20px;

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


    <main class="pagina">


        <!-- =====================================
             CABEÇALHO
        ====================================== -->

        <header class="cabecalho">


            <div class="marca">


                <div class="icone-radio">

                    📻

                </div>


                <div>

                    <div class="empresa">

                        Postos Graciosa

                    </div>


                    <div class="titulo">

                        Posto Graciosa

                    </div>


                    <div class="subtitulo">

                        Sistema de rádio ambiente

                    </div>

                </div>


            </div>


            <div
                id="statusRadio"
                class="status"
            >

                <span
                    class="status-ponto"
                ></span>


                <div class="status-info">

                    <span class="status-label">

                        Status

                    </span>


                    <span
                        id="statusTexto"
                        class="status-texto"
                    >

                        RÁDIO ATIVA

                    </span>

                </div>

            </div>


        </header>



        <!-- =====================================
             CONTEÚDO
        ====================================== -->

        <section class="conteudo">


            <!-- INFORMAÇÕES -->

            <div class="informacoes">


                <div class="info-card">

                    <span class="info-label">

                        Posto

                    </span>


                    <span class="info-valor">

                        Graciosa

                    </span>

                </div>


                <div class="info-card">

                    <span class="info-label">

                        Data

                    </span>


                    <span
                        id="dataAtual"
                        class="info-valor"
                    >

                        --

                    </span>

                </div>


                <div class="info-card">

                    <span class="info-label">

                        Horário

                    </span>


                    <span
                        id="horaAtual"
                        class="info-valor"
                    >

                        --

                    </span>

                </div>


            </div>



            <!-- =================================
                 PLAYER
            ================================== -->

            <section class="player-area">


                <div class="player-cabecalho">


                    <div class="player-nome">

                        📻 Rádio Postos Graciosa

                    </div>


                    <span class="ao-vivo">

                        ● Ao vivo

                    </span>


                </div>


                <iframe

                    id="radioPlayer"

                    class="player"

                    src="https://public-player-widget.webradiosite.com/?cover=1&current_track=1&schedules=1&link=1&popup=1&share=1&embed=0&auto_play=1&source=7074&theme=light&color=0&identifier=ADM%20Player&info=https%3A%2F%2Fpublic-player-widget.webradiosite.com%2Fapp%2Fplayer%2Finfo%2F254029%3Fhash%3D64003997581a207b40b5673c010bcc7cc044bb7d&locale=pt-br"

                    scrolling="no"

                    frameborder="0"

                    allow="autoplay; clipboard-write"

                    allowtransparency="true"

                >

                </iframe>


            </section>



            <!-- =================================
                 MONITORAMENTO
            ================================== -->

            <section class="monitoramento">


                <div class="monitor-icone">

                    🛡️

                </div>


                <div>

                    <div class="monitor-titulo">

                        Monitoramento 24 horas

                    </div>


                    <div
                        id="monitoramentoTexto"
                        class="monitor-texto"
                    >

                        Sistema preparado para acompanhar
                        continuamente a rádio.

                    </div>

                </div>


            </section>


        </section>



        <!-- =====================================
             RODAPÉ
        ====================================== -->

        <footer class="rodape">


            <span>

                Postos Graciosa

            </span>


            <span>

                Monitoramento:
                <strong>24 horas</strong>

            </span>


        </footer>


    </main>



    <script>

        /* =========================================
           CONFIGURAÇÃO
        ========================================= */

        const CONFIG = {

            posto:
                "Posto Graciosa",

            identificador:
                "GRACIOSA",

            email:
                "administracao@postosgraciosa.com.br",

            stream:
                "https://servidor33-2.brlogic.com:7200/live?source=7074",

            tempoConfirmacao:
                120000

        };



        /* =========================================
           ELEMENTOS
        ========================================= */

        const dataAtual =
            document.getElementById(
                "dataAtual"
            );


        const horaAtual =
            document.getElementById(
                "horaAtual"
            );


        const statusRadio =
            document.getElementById(
                "statusRadio"
            );


        const statusTexto =
            document.getElementById(
                "statusTexto"
            );


        const monitoramentoTexto =
            document.getElementById(
                "monitoramentoTexto"
            );



        /* =========================================
           RELÓGIO
        ========================================= */

        function atualizarRelogio() {

            const agora =
                new Date();


            dataAtual.textContent =
                agora.toLocaleDateString(
                    "pt-BR"
                );


            horaAtual.textContent =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );

        }


        atualizarRelogio();


        setInterval(
            atualizarRelogio,
            1000
        );



        /* =========================================
           STATUS
        ========================================= */

        function definirStatus(
            status
        ) {

            statusRadio.classList.remove(
                "offline",
                "atencao"
            );


            if (
                status ===
                "online"
            ) {

                statusTexto.textContent =
                    "RÁDIO ATIVA";

            }


            if (
                status ===
                "atencao"
            ) {

                statusRadio.classList.add(
                    "atencao"
                );

                statusTexto.textContent =
                    "VERIFICANDO";

            }


            if (
                status ===
                "offline"
            ) {

                statusRadio.classList.add(
                    "offline"
                );

                statusTexto.textContent =
                    "RÁDIO PAUSADA";

            }

        }



        /* =========================================
           STATUS INICIAL
        ========================================= */

        definirStatus(
            "online"
        );



        /* =========================================
           REGISTRO DE INTERRUPÇÃO
        ========================================= */

        function registrarInterrupcao() {

            const agora =
                new Date();


            const data =
                agora.toLocaleDateString(
                    "pt-BR"
                );


            const hora =
                agora.toLocaleTimeString(
                    "pt-BR"
                );


            definirStatus(
                "offline"
            );


            monitoramentoTexto.innerHTML =

                "🔴 <strong>Rádio pausada.</strong> " +

                "Posto: " +
                CONFIG.posto +
                " | " +

                "Data: " +
                data +
                " | " +

                "Horário: " +
                hora;

        }



        /* =========================================
           DADOS DO ALERTA
        ========================================= */

        function prepararAlertaEmail() {

            const agora =
                new Date();


            return {

                posto:
                    CONFIG.posto,

                identificador:
                    CONFIG.identificador,

                email:
                    CONFIG.email,

                data:
                    agora.toLocaleDateString(
                        "pt-BR"
                    ),

                horario:
                    agora.toLocaleTimeString(
                        "pt-BR"
                    ),

                assunto:
                    "ALERTA - Rádio pausada | " +
                    CONFIG.posto,

                status:
                    "RÁDIO PAUSADA"

            };

        }



        /* =========================================
           RECONEXÃO DO PLAYER
        ========================================= */

        function tentarReconectar() {

            const player =
                document.getElementById(
                    "radioPlayer"
                );


            const endereco =
                player.src;


            player.src =
                endereco;

        }



        /* =========================================
           INTERNET
        ========================================= */

        window.addEventListener(
            "online",
            function () {

                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.textContent =
                    "🟡 Internet restabelecida. " +
                    "Verificando conexão da rádio...";


                setTimeout(
                    function () {

                        tentarReconectar();

                    },
                    3000
                );

            }
        );


        window.addEventListener(
            "offline",
            function () {

                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.textContent =
                    "🟡 Conexão com a internet " +
                    "interrompida. " +
                    "Aguardando reconexão.";

            }
        );



        /* =========================================
           WAKE LOCK
        ========================================= */

        let wakeLock =
            null;


        async function ativarWakeLock() {

            try {

                if (
                    "wakeLock" in navigator
                ) {

                    wakeLock =
                        await navigator.wakeLock.request(
                            "screen"
                        );

                    console.log(
                        "Wake Lock ativado."
                    );

                }

            }

            catch (erro) {

                console.log(
                    "Wake Lock não disponível:",
                    erro
                );

            }

        }


        ativarWakeLock();



        /* =========================================
           RETORNO PARA A ABA
        ========================================= */

        document.addEventListener(
            "visibilitychange",
            async function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    await ativarWakeLock();

                }

            }
        );



        /* =========================================
           RECONEXÃO DE SEGURANÇA
           A CADA 6 HORAS
        ========================================= */

        setInterval(
            function () {

                tentarReconectar();

            },
            6 * 60 * 60 * 1000
        );



        /* =========================================
           RECARREGAMENTO DIÁRIO
        ========================================= */

        setInterval(
            function () {

                window.location.reload();

            },
            24 * 60 * 60 * 1000
        );



        /* =========================================
           LOG
        ========================================= */

        console.log(
            "================================="
        );

        console.log(
            "MONITORAMENTO DA RÁDIO"
        );

        console.log(
            "================================="
        );

        console.log(
            "Posto:",
            CONFIG.posto
        );

        console.log(
            "Identificador:",
            CONFIG.identificador
        );

        console.log(
            "Stream:",
            CONFIG.stream
        );

        console.log(
            "E-mail:",
            CONFIG.email
        );

        console.log(
            "Monitoramento iniciado."
        );

    </script>


</body>

</html>
