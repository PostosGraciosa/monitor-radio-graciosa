    <!-- =========================================
         TESTE REAL DO STREAM
         
         Este áudio NÃO substitui o player visual.
         Ele serve exclusivamente para verificar
         se o servidor da rádio está entregando
         áudio.
    ========================================== -->

    <audio
        id="streamMonitor"
        preload="auto"
        autoplay
        muted
        playsinline
    ></audio>



    <script>

        /* =========================================
           CONFIGURAÇÃO
        ========================================== */

        const CONFIG = {

            posto:
                "Posto Graciosa",

            identificador:
                "GRACIOSA",

            email:
                "administracao@postosgraciosa.com.br",

            stream:
                "https://servidor33-2.brlogic.com:7200/live?source=7074",

            /*

               Tempo que o stream pode ficar sem
               progresso antes de ser considerado
               uma possível interrupção.

               30 segundos nesta fase de teste.

            */

            limiteSemDados:
                30000,

            /*

               Intervalo entre testes.

            */

            intervaloTeste:
                10000

        };



        /* =========================================
           ELEMENTOS
        ========================================== */

        const dataAtual =
            document.getElementById(
                "dataAtual"
            );


        const horaAtual =
            document.getElementById(
                "horaAtual"
            );


        const statusRadio =
            document.getElementById(
                "statusRadio"
            );


        const statusTexto =
            document.getElementById(
                "statusTexto"
            );


        const monitoramentoTexto =
            document.getElementById(
                "monitoramentoTexto"
            );


        const streamMonitor =
            document.getElementById(
                "streamMonitor"
            );



        /* =========================================
           VARIÁVEIS DO MONITOR
        ========================================== */

        let ultimoProgresso =
            Date.now();


        let streamFuncionando =
            false;


        let verificando =
            true;


        let primeiraConexao =
            true;



        /* =========================================
           RELÓGIO
        ========================================== */

        function atualizarRelogio() {

            const agora =
                new Date();


            dataAtual.textContent =
                agora.toLocaleDateString(
                    "pt-BR"
                );


            horaAtual.textContent =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );

        }


        atualizarRelogio();


        setInterval(
            atualizarRelogio,
            1000
        );



        /* =========================================
           STATUS VISUAL
        ========================================== */

        function definirStatus(
            status
        ) {

            statusRadio.classList.remove(
                "offline",
                "atencao"
            );


            if (
                status ===
                "online"
            ) {

                statusTexto.textContent =
                    "RÁDIO ONLINE";

            }


            if (
                status ===
                "atencao"
            ) {

                statusRadio.classList.add(
                    "atencao"
                );

                statusTexto.textContent =
                    "VERIFICANDO";

            }


            if (
                status ===
                "offline"
            ) {

                statusRadio.classList.add(
                    "offline"
                );

                statusTexto.textContent =
                    "RÁDIO OFFLINE";

            }

        }



        /* =========================================
           DATA/HORA DO ÚLTIMO SINAL
        ========================================== */

        function registrarSinal() {

            ultimoProgresso =
                Date.now();

        }



        /* =========================================
           EVENTO: STREAM COMEÇOU A TOCAR
        ========================================== */

        streamMonitor.addEventListener(
            "playing",
            function () {

                registrarSinal();

                streamFuncionando =
                    true;

                verificando =
                    false;

                definirStatus(
                    "online"
                );


                monitoramentoTexto.innerHTML =

                    "🟢 <strong>Stream conectado.</strong> " +

                    "O servidor da rádio está " +
                    "entregando áudio normalmente.";

                console.log(
                    "STREAM ONLINE"
                );

            }
        );



        /* =========================================
           EVENTO: TEMPO DE ÁUDIO AVANÇOU
        ========================================== */

        streamMonitor.addEventListener(
            "timeupdate",
            function () {

                registrarSinal();

                if (
                    !streamFuncionando
                ) {

                    streamFuncionando =
                        true;

                    verificando =
                        false;

                    definirStatus(
                        "online"
                    );

                }

            }
        );



        /* =========================================
           EVENTO: PODE TOCAR
        ========================================== */

        streamMonitor.addEventListener(
            "canplay",
            function () {

                registrarSinal();

                console.log(
                    "STREAM DISPONÍVEL"
                );

            }
        );



        /* =========================================
           EVENTO: ESPERA POR DADOS
        ========================================== */

        streamMonitor.addEventListener(
            "waiting",
            function () {

                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.innerHTML =

                    "🟡 <strong>Stream aguardando dados.</strong> " +

                    "O monitor está verificando " +
                    "a continuidade da transmissão.";

                console.log(
                    "STREAM WAITING"
                );

            }
        );



        /* =========================================
           EVENTO: STREAM PAROU DE ENTREGAR DADOS
        ========================================== */

        streamMonitor.addEventListener(
            "stalled",
            function () {

                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.innerHTML =

                    "🟡 <strong>Stream sem novos dados.</strong> " +

                    "Aguardando confirmação.";

                console.log(
                    "STREAM STALLED"
                );

            }
        );



        /* =========================================
           EVENTO: ERRO
        ========================================== */

        streamMonitor.addEventListener(
            "error",
            function () {

                streamFuncionando =
                    false;


                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.innerHTML =

                    "🟡 <strong>Falha na conexão.</strong> " +

                    "O monitor tentará reconectar.";

                console.log(
                    "ERRO NO STREAM",
                    streamMonitor.error
                );

            }
        );



        /* =========================================
           TESTE INICIAL
        ========================================== */

        function iniciarTesteStream() {

            console.log(
                "================================="
            );

            console.log(
                "TESTE REAL DO STREAM"
            );

            console.log(
                "Posto:",
                CONFIG.posto
            );

            console.log(
                "Stream:",
                CONFIG.stream
            );

            console.log(
                "================================="
            );


            definirStatus(
                "atencao"
            );


            monitoramentoTexto.innerHTML =

                "🟡 <strong>Conectando ao stream...</strong>";


            streamMonitor.src =
                CONFIG.stream;


            streamMonitor.load();


            const promessa =
                streamMonitor.play();


            if (
                promessa !== undefined
            ) {

                promessa
                    .then(
                        function () {

                            console.log(
                                "Reprodução do monitor iniciada."
                            );

                        }
                    )
                    .catch(
                        function (erro) {

                            console.log(
                                "Autoplay do monitor:",
                                erro
                            );

                        }
                    );

            }

        }



        /* =========================================
           VERIFICAÇÃO CONTÍNUA
        ========================================== */

        function verificarStream() {

            const agora =
                Date.now();


            const tempoSemProgresso =
                agora -
                ultimoProgresso;


            /*
               Se ainda não recebemos nenhum
               sinal e passaram 30 segundos,
               consideramos que o stream não
               conseguiu iniciar.
            */

            if (
                primeiraConexao &&
                tempoSemProgresso >
                CONFIG.limiteSemDados
            ) {

                primeiraConexao =
                    false;

                streamFuncionando =
                    false;

                definirStatus(
                    "offline"
                );


                monitoramentoTexto.innerHTML =

                    "🔴 <strong>Stream não respondeu.</strong> " +

                    "O servidor da rádio não " +
                    "está entregando áudio ao monitor.";

                console.log(
                    "STREAM OFFLINE - TESTE INICIAL"
                );

                return;

            }


            /*
               Depois que já funcionou,
               verifica se parou de avançar.
            */

            if (
                streamFuncionando &&
                tempoSemProgresso >
                CONFIG.limiteSemDados
            ) {

                streamFuncionando =
                    false;

                definirStatus(
                    "offline"
                );


                const agoraData =
                    new Date();


                monitoramentoTexto.innerHTML =

                    "🔴 <strong>Stream interrompido.</strong><br>" +

                    "Posto: " +
                    CONFIG.posto +
                    "<br>" +

                    "Data: " +
                    agoraData.toLocaleDateString(
                        "pt-BR"
                    ) +
                    "<br>" +

                    "Horário: " +
                    agoraData.toLocaleTimeString(
                        "pt-BR"
                    );


                console.log(
                    "STREAM OFFLINE"
                );

            }

        }


        setInterval(
            verificarStream,
            CONFIG.intervaloTeste
        );



        /* =========================================
           RECONEXÃO AUTOMÁTICA
        ========================================== */

        function reconectarStream() {

            console.log(
                "Tentando reconectar stream..."
            );


            streamFuncionando =
                false;


            verificando =
                true;


            ultimoProgresso =
                Date.now();


            definirStatus(
                "atencao"
            );


            monitoramentoTexto.innerHTML =

                "🟡 <strong>Reconectando...</strong>";


            streamMonitor.pause();


            streamMonitor.src =
                "";


            setTimeout(
                function () {

                    streamMonitor.src =
                        CONFIG.stream;

                    streamMonitor.load();


                    const promessa =
                        streamMonitor.play();


                    if (
                        promessa !== undefined
                    ) {

                        promessa.catch(
                            function (erro) {

                                console.log(
                                    "Reconexão aguardando:",
                                    erro
                                );

                            }
                        );

                    }

                },
                1500
            );

        }



        /* =========================================
           TENTATIVA DE RECONEXÃO A CADA 60 SEGUNDOS
        ========================================== */

        setInterval(
            function () {

                if (
                    !streamFuncionando
                ) {

                    reconectarStream();

                }

            },
            60000
        );



        /* =========================================
           INTERNET
        ========================================== */

        window.addEventListener(
            "online",
            function () {

                console.log(
                    "INTERNET RESTABELECIDA"
                );


                reconectarStream();

            }
        );


        window.addEventListener(
            "offline",
            function () {

                streamFuncionando =
                    false;


                definirStatus(
                    "atencao"
                );


                monitoramentoTexto.innerHTML =

                    "🟡 <strong>Internet desconectada.</strong> " +

                    "Aguardando conexão.";

            }
        );



        /* =========================================
           WAKE LOCK
        ========================================== */

        let wakeLock =
            null;


        async function ativarWakeLock() {

            try {

                if (
                    "wakeLock" in navigator
                ) {

                    wakeLock =
                        await navigator.wakeLock.request(
                            "screen"
                        );

                    console.log(
                        "Wake Lock ativado."
                    );

                }

            }

            catch (erro) {

                console.log(
                    "Wake Lock não disponível:",
                    erro
                );

            }

        }


        ativarWakeLock();



        /* =========================================
           VOLTA PARA A ABA
        ========================================== */

        document.addEventListener(
            "visibilitychange",
            async function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    await ativarWakeLock();

                }

            }
        );



        /* =========================================
           INICIALIZAÇÃO
        ========================================== */

        iniciarTesteStream();



        /* =========================================
           RECARGA DE SEGURANÇA
           A CADA 6 HORAS
        ========================================== */

        setInterval(
            function () {

                location.reload();

            },
            6 * 60 * 60 * 1000
        );

    </script>
